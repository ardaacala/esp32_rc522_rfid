[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DMFRC522_SPICLOCK=1000000u
lib_deps =
    miguelbalboa/MFRC522@^1.4.12

[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
; Pass the board IP using --upload-port.
